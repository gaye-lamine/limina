<a class="skip" href="#main">{{ s.skipLink }}</a>
<header class="topbar">
  <span class="wordmark"><svg class="wordmark-mark" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false"><path class="wm-arc" d="M3 16 A 13 13 0 0 1 17 4" /><path class="wm-limit" d="M3 4 H17" /><circle class="wm-dot" cx="12.5" cy="7.2" r="1.8" /></svg><span>{{ u.wordmark }}</span></span>
  <nav class="topbar-nav" aria-label="Main">
    <button type="button" class="nav-link topbar-library" (click)="openDrawer('library')" [attr.aria-expanded]="drawerOpen() && drawerView() === 'library'" aria-controls="drawer">
      {{ u.library }}
    </button>
    <button type="button" class="nav-link topbar-how" (click)="openDrawer('how')" [attr.aria-expanded]="drawerOpen() && drawerView() === 'how'" aria-controls="drawer">
      {{ u.howItWorks }}
    </button>
    <button type="button" class="kbd-hint" (click)="openPalette()" [attr.aria-label]="u.commandOpen">
      <kbd class="kbd">Ctrl</kbd><kbd class="kbd">K</kbd>
    </button>
  </nav>
</header>
<main id="main" class="main">
  <app-workbench />
</main>
<aside
  id="drawer"
  class="drawer"
  [class.is-open]="drawerOpen()"
  [hidden]="!drawerOpen()"
  role="dialog"
  aria-modal="true"
  aria-labelledby="drawer-title"
  tabindex="-1"
  [cdkTrapFocus]="drawerOpen()"
  #drawer
>
  <div class="drawer-head">
    <h2 id="drawer-title" class="drawer-title">{{ drawerView() === 'library' ? u.library : u.howItWorks }}</h2>
    <button type="button" class="icon-btn drawer-close" (click)="closeDrawer()" [attr.aria-label]="u.close">
      <lucide-icon [img]="XIcon" [size]="18" aria-hidden="true" />
    </button>
  </div>
  <div class="drawer-tabs" role="group">
    <button type="button" class="chip" [attr.aria-pressed]="drawerView() === 'library'" (click)="drawerView.set('library')">{{ u.library }}</button>
    <button type="button" class="chip" [attr.aria-pressed]="drawerView() === 'how'" (click)="drawerView.set('how')">{{ u.howItWorks }}</button>
  </div>
  <section class="how" aria-labelledby="how-title" [hidden]="drawerView() !== 'how'">
    <h2 id="how-title" class="drawer-sub">{{ s.howTitle }}</h2>
    <p>{{ s.howDeterministic }}</p>
    <p>{{ s.howLanguageModel }}</p>
    <p class="muted">{{ s.howPriorArt }}</p>
    <p class="muted">{{ s.footerNote }}</p>
  </section>
  <div [hidden]="drawerView() !== 'library'">
    <app-limits-list [limits]="limits()" [failure]="limitsFailure()" />
  </div>
</aside>
@if (drawerOpen()) {
  <button type="button" class="scrim" tabindex="-1" (click)="closeDrawer()" [attr.aria-label]="u.close"></button>
}
<div class="toasts" aria-live="polite">
  @for (t of toasts.toasts(); track t.id) {
    <div class="toast toast--{{ t.kind }}" [attr.role]="t.kind === 'error' ? 'alert' : 'status'">
      <span>{{ t.text }}</span>
      <button type="button" class="icon-btn icon-btn-sm" (click)="toasts.dismiss(t.id)" [attr.aria-label]="u.dismiss">
        <lucide-icon [img]="XIcon" [size]="14" aria-hidden="true" />
      </button>
    </div>
  }
</div>
