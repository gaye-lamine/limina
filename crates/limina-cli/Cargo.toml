[package]
name = "limina-cli"
version = "0.1.0"
edition = "2021"
description = "limina check: reads a document, extracts its performance claims and checks them against the physical limits, like a linter."
license = "MIT"
publish = false

[[bin]]
name = "limina"
path = "src/main.rs"

[dependencies]
limina-api = { path = "../limina-api" }
limina-extract = { path = "../limina-extract" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
