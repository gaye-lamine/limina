[package]
name = "limina-api"
version = "0.1.0"
edition = "2021"
description = "Limina HTTP API over the deterministic decision engine."
license = "MIT"
publish = false

[dependencies]
limina-core = { path = "../limina-core" }
limina-extract = { path = "../limina-extract" }
limina-dsl = { path = "../limina-dsl" }
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
proptest = "=1.12.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
