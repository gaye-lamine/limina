[package]
name = "limina-extract"
version = "0.1.0"
edition = "2021"
description = "Reads performance claims out of text through a language model, then checks every value against the text deterministically."
license = "MIT"
publish = false

[dependencies]
limina-core = { path = "../limina-core" }
limina-dsl = { path = "../limina-dsl" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
