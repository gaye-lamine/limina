[package]
name = "limina-mcp"
version = "0.1.0"
edition = "2021"
description = "Limina MCP server over stdio: a thin client of the Limina HTTP API. It computes no verdict and holds no key."
license = "MIT"
publish = false

[dependencies]
rmcp = { version = "=3.12.0", default-features = false, features = ["server", "macros", "transport-io"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "io-std"] }
