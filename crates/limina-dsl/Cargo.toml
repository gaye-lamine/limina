[package]
name = "limina-dsl"
version = "0.1.0"
edition = "2021"
description = "Declarative physical limits: a small expression language checked for dimensions and run in the Limina decision engine."
license = "MIT"
publish = false

[dependencies]
limina-core = { path = "../limina-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"

[dev-dependencies]
proptest = "=1.12.0"
serde_json = "=1.0.154"
